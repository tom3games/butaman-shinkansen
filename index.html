<style>
[hidden]{display:none!important}
:root{--wall:#ece7dc;--wallD:#cfc7b6;--seat:#2f5fa8;--seatD:#1f427a;--ink:#2b2622;--led:#ff9a1f;--panel:#141110;--bun:#f6efe2;--steam:#f0b98a;--red:#c8402e;

*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--wall)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--maru);color:var(--ink);overflow:hidden;height:100svh;background:transparent}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.view{position:fixed;inset:0;height:100svh;overflow:hidden;z-index:2;background:var(--wall)}
.wrap{position:relative;height:100%;max-width:480px;margin:0 auto}
.led{font-family:var(--dot);color:var(--led);text-shadow:0 0 6px rgba(255,150,30,.6)}
#loading{position:fixed;inset:0;z-index:90;background:var(--wall);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s}

#loading .stm i:nth-child(2){left:40px;animation-delay:.4s}#loading .stm i:nth-child(3){left:62px;animation-delay:.8s}#loading .stm i:nth-child(1){left:18px}
@keyframes stm{0%{transform:translateY(10px) scaleY(.5);opacity:0}40%{opacity:.7}100%{transform:translateY(-26px) scaleY(1.2);opacity:0}}
#loading .bn{position:absolute;left:10px;bottom:0;width:70px;height:34px;border-radius:50% 50% 40% 40%;background:var(--bun);box-shadow:inset 0 -6px 0 #e3d7c0}
#loadBar{width:150px;height:6px;border-radius:3px;background:#d8d0bf;overflow:hidden}#loadBar i{display:block;height:100%;width:0;background:var(--ink)}
/* タイトル */
#vTitle .wrap{display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom) + var(--inapp-bot,0px))}
.board{background:var(--panel);border-radius:6px;padding:8px 12px;box-shadow:inset 0 0 0 3px #2b2522}
#tLed{font-size:15px;white-space:nowrap;overflow:hidden}
#tLed span{display:inline-block;animation:scroll 9s linear infinite;padding-left:100%}
@keyframes scroll{to{transform:translateX(-100%)}}
#tH{margin-top:16px;font-weight:900;line-height:1.05}
#tH .a{display:block;font-size:min(9vw,38px,5svh);color:var(--seat)}
#tH .b{display:block;font-size:min(10.6vw,50px,6.6svh);letter-spacing:-.03em;white-space:nowrap}
#tSub{margin-top:8px;font-size:15px;font-weight:700;color:#5c544b}
#tPic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#tPic .tSeat{position:relative;height:100%;max-height:300px;aspect-ratio:1.25;max-width:96%;border-radius:18px;background:url(art/bg.webp) 50% 70%/120% auto;box-shadow:inset 0 0 0 4px #d8d1c3;overflow:hidden}
#tPic .tSeat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:url(art/fg.webp) 50% 0/120% auto;z-index:3}
#tPic img{position:absolute;bottom:0;height:86%}
#tPic .tA{left:2%;height:72%;z-index:2}#tPic .tB{right:2%}
#tPic .tQ{position:absolute;right:4%;top:6%;z-index:4;width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid var(--ink);font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;animation:tq 1.6s ease-in-out infinite}
@keyframes tq{50%{transform:translateY(-6px) rotate(8deg)}}
#tBest{font-size:14px;font-weight:700;color:var(--red);min-height:18px;text-align:center}
/* 一番押してほしいボタン = 切符 */
#bStart{align-self:center;margin-top:8px;width:min(80vw,300px);height:76px;background:#d9ecf3;border-radius:4px;box-shadow:0 5px 0 #8fb6c4,0 9px 16px rgba(0,0,0,.18);position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:900;font-size:22px;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 2px,transparent 2px 6px)}
#bStart small{font-family:var(--dot);font-size:12px;font-weight:400;color:#3d6a7a;text-align:left;line-height:1.3}

.tLinks{display:flex;gap:6px;justify-content:center;margin-top:14px}
.tLinks button{min-height:44px;padding:0 12px;font-size:14px;font-weight:700;color:#5c544b;border-radius:22px}
.tLinks svg,#bMute2 svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
/* 遊ぶ */
#vPlay .wrap{display:flex;flex-direction:column}
#top{padding:calc(6px + env(safe-area-inset-top)) 8px 0}
#led{display:flex;justify-content:space-between;align-items:center;font-size:18px;height:40px;padding:0 12px}
#route{position:relative;height:22px;margin:4px 6px 0}
#route .ln{position:absolute;left:4px;right:4px;top:10px;height:3px;background:#b9b1a2}
#route .st{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;background:var(--wall);border:3px solid #8d8577;transform:translateX(-50%)}
#route .me{position:absolute;top:2px;width:18px;height:18px;transform:translateX(-50%);transition:left .2s linear}
#scene{position:relative;flex:1;min-height:0;overflow:hidden;background:#e9e0cc}
#stage{position:absolute}
#bg,#fg{position:absolute;left:0;width:100%;display:block}
#bg{top:0;height:100%}
#fg{bottom:0;height:21.2%;z-index:6}
#win{position:absolute;left:5%;width:91.4%;top:15.4%;height:28.6%;border-radius:7%/14%;overflow:hidden;background:#a9dcf0}
#bg{z-index:1}
#win{z-index:2}
#sky{position:absolute;inset:0;background:linear-gradient(#8fd0ef,#cdeefa 70%)}
#hills{position:absolute;left:0;right:0;bottom:26%;height:34%;background:radial-gradient(60px 40px at 50px 100%,#7fae8a 98%,transparent) 0 100%/170px 100% repeat-x,radial-gradient(90px 50px at 120px 100%,#94bf99 98%,transparent) 0 100%/260px 100% repeat-x;animation:hills 9s linear infinite}
@keyframes hills{to{background-position:-170px 100%,-260px 100%}}
#fields{position:absolute;left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(90deg,#8cc46b 0 60px,#7db45c 60px 110px,#93c977 110px 170px);background-size:340px 100%;animation:poles 1.6s linear infinite}
#poles{position:absolute;left:0;right:0;bottom:0;height:80%;background:repeating-linear-gradient(90deg,transparent 0 200px,#5d5852 200px 205px);background-size:400px 100%;animation:poles2 .7s linear infinite}
@keyframes poles{to{background-position:-340px 0}}
@keyframes poles2{to{background-position:-400px 0}}
#fuji{position:absolute;left:20%;bottom:18%;width:56%;height:72%;opacity:0;transform:translateX(30%);transition:opacity .8s,transform 4s linear}
#fuji.on{opacity:1;transform:translateX(-10%)}
.spr{position:absolute;bottom:18%;left:var(--x);transform:translateX(calc(-1 * var(--ax))) translateY(var(--lift,0%));transform-origin:50% 100%;z-index:3;pointer-events:none}
.spr.flip{transform:translateX(calc(-1 * var(--ax))) scaleX(-1)}
.spr.pop{animation:pop .16s ease-out}
@keyframes pop{0%{translate:0 2%}100%{translate:0 0}}
#me{z-index:4}
#cond{z-index:5}
#kid{position:absolute;z-index:7;right:-2%;bottom:-6%;width:44%;transform:translate(110%,0) rotate(-6deg);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#kid.peek{transform:translate(62%,30%) rotate(-10deg)}
#kid.look{transform:translate(0,0) rotate(-4deg)}
#smell{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
#sus{position:absolute;width:13%;aspect-ratio:1;z-index:9;transform:translate(-50%,-50%);pointer-events:none;transition:opacity .2s}
#sus svg{width:100%;height:100%;display:block}
#say,#sayMe{position:absolute;z-index:10;transform:translateX(-50%);background:#fff;border-radius:16px;padding:6px 14px;font-weight:900;font-size:19px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15);opacity:0;transition:opacity .15s;pointer-events:none;border:2px solid var(--ink)}
#say.on{opacity:1}
#sayMe{color:var(--red);font-size:24px;border-color:var(--red)}
#sayMe.on{animation:safe .9s ease-out forwards}
@keyframes safe{0%{opacity:0;transform:translateX(-50%) scale(1.8)}15%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
#tellMark{position:absolute;z-index:9;width:12%;opacity:0;pointer-events:none;transform:translate(-50%,0)}
#tellMark.on{opacity:1;animation:twitch .22s ease-in-out infinite alternate}
@keyframes twitch{from{transform:translate(-50%,0) scale(.9)}to{transform:translate(-60%,-4%) scale(1.08)}}
#vig{position:absolute;inset:0;z-index:11;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(120,10,0,.55) 100%);transition:opacity .15s}
#ev{position:absolute;z-index:12;left:50%;top:6px;transform:translateX(-50%);font-family:var(--dot);background:var(--panel);color:var(--led);font-size:15px;padding:4px 12px;border-radius:4px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
#ev.on{opacity:1}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
#box.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.1)}}
#tray{position:relative;height:clamp(150px,28svh,210px);background:linear-gradient(#bfb39d,#a99c84);border-top:5px solid #8e826c;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 12px calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px))}
#box{position:relative;width:96px;height:62px;background:#e9dcc4;border-radius:6px;box-shadow:inset 0 0 0 2px #c9b896,0 3px 0 #8e826c;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px}
#box i{display:block;border-radius:50% 50% 40% 40%;background:var(--bun);box-shadow:inset 0 -3px 0 #e3d7c0}
#box i.gone{opacity:.12}
#bBite{position:relative;width:clamp(110px,30vw,140px);height:clamp(110px,30vw,140px);border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,var(--bun) 55%,#e2d3b6);box-shadow:0 6px 0 #c9b896,0 10px 18px rgba(0,0,0,.2);touch-action:none}
#bBite.hold{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 #c9b896}
#bBite .bit{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 92% 50%,#a99c84 0 var(--b,0%),transparent calc(var(--b,0%) + 1%))}
#bBite span{position:absolute;left:0;right:0;bottom:-28px;font-size:13px;font-weight:700;color:#4a4136;text-align:center}
#count{font-family:var(--dot);font-size:26px;color:#3a332b;width:64px;text-align:center}
#bMute2{position:absolute;right:8px;top:8px;z-index:7;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.7);color:#5c544b}
/* 結果 = 乗車券 */
#vRes .wrap{display:flex;flex-direction:column;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom) + var(--inapp-bot,0px))}
#tk{position:relative;background:#d9ecf3;border-radius:6px;padding:16px 18px;box-shadow:0 8px 20px rgba(0,0,0,.18);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.4) 0 2px,transparent 2px 6px);transform:rotate(-1.5deg)}
#tk .h{display:flex;justify-content:space-between;font-family:var(--dot);color:#3d6a7a;font-size:14px}
#tk .rt{display:flex;align-items:center;gap:10px;font-weight:900;font-size:26px;margin-top:6px}
#tk .rt i{flex:1;height:3px;background:var(--ink)}
#rBuns{display:flex;gap:6px;margin-top:12px}
#rBuns i{width:44px;height:30px;border-radius:50% 50% 40% 40%;background:var(--bun);box-shadow:inset 0 -4px 0 #e3d7c0}
#rBuns i.no{background:transparent;border:2px dashed #8fb6c4;box-shadow:none}
#rNum{margin-top:10px;font-weight:900;font-size:22px}
#rRank{padding-right:96px;font-weight:900;font-size:clamp(26px,8vw,36px);margin-top:4px;color:var(--seatD)}
#rWhere{font-size:14px;font-weight:700;color:#4c6d79;margin-top:6px}
#rFace{position:absolute;right:10px;top:-58px;height:110px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
#stamp{position:absolute;right:12px;top:auto;bottom:18px;width:96px;height:96px;border-radius:50%;border:4px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:15px;letter-spacing:-.04em;line-height:1.1;transform:rotate(14deg) scale(2.2);opacity:0;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#stamp.on{transform:rotate(14deg) scale(1);opacity:.9}
#rBtns{display:flex;flex-direction:column;align-items:center;margin-top:22px}
#bAgain{min-width:220px;height:56px;border-radius:28px;background:var(--seat);color:#fff;font-weight:900;font-size:19px;box-shadow:0 5px 0 var(--seatD)}
#bAgain:active{transform:translateY(4px);box-shadow:0 1px 0 var(--seatD)}
#rSub{display:flex;gap:8px;margin-top:12px}
#rSub button{min-height:44px;padding:0 14px;border-radius:22px;font-size:14px;font-weight:700;color:#5c544b;background:rgba(0,0,0,.06)}
#vHow{z-index:20;background:rgba(30,26,22,.7);display:flex;align-items:center;justify-content:center;padding:16px}
#howCard{background:#fff;border-radius:8px;max-width:420px;width:100%;padding:18px;display:flex;flex-direction:column}

#howList{margin-top:10px;display:flex;flex-direction:column;gap:10px}
#howList div{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:14px;line-height:1.55;font-weight:700}

#howCred{font-size:10px;color:#7b7266;margin-top:12px;line-height:1.4}
#bHowClose{align-self:center;margin-top:12px;min-height:44px;padding:0 26px;border-radius:22px;background:var(--ink);color:#fff;font-weight:700}
@media (max-height:700px){#tH .b{font-size:min(11vw,50px,7svh)}#bStart{height:66px}#howList div{font-size:13px}}
</style>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('#bBite'))e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__jsUp) return;
    var l=document.getElementById('loading');if(l)l.style.display='none';
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:199;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },15000);
})();
</script>
